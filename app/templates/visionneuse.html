<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalier : visionneuse 3D</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script type="importmap">
{ "imports": {
    "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
    "three/addons/": "{{ url_for('static', filename='vendor/three/examples/jsm/') }}"
} }
</script>
<style>
  body { height: 100vh; margin: 0; overflow: hidden; }
  .barre { display: flex; align-items: center; gap: 1rem; padding: .6rem 1.25rem;
           border-bottom: 1px solid var(--rule); background: var(--sheet); }
  .barre a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .barre a:hover { text-decoration: underline; }
  .barre span { color: var(--muted); font-size: .9rem; }
  #viewer { position: fixed; inset: 0; top: 48px; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="barre">
  <a href="/">&larr; Retour au formulaire</a>
  <span>Escalier — vue 3D (orbiter : glisser la souris ; zoomer : molette)</span>
</div>
<div id="viewer"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const donnees = {{ donnees|tojson }};
const conteneur = document.getElementById("viewer");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6e2da);

const camera = new THREE.PerspectiveCamera(50, conteneur.clientWidth / conteneur.clientHeight, 1, 100000);
camera.up.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(conteneur.clientWidth, conteneur.clientHeight);
conteneur.appendChild(renderer.domElement);

// Géométrie de l'escalier : tampon non indexé (une couleur par sommet), normales recalculées
// côté client - chaque sommet n'appartient qu'à un seul triangle (tampon non indexé), donc
// computeVertexNormals() donne exactement une normale par triangle (ombrage plat correct).
const geometrie = new THREE.BufferGeometry();
geometrie.setAttribute("position", new THREE.BufferAttribute(new Float32Array(donnees.positions), 3));
geometrie.setAttribute("color", new THREE.BufferAttribute(new Float32Array(donnees.colors), 3));
geometrie.computeVertexNormals();
const materiau = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide });
const escalier3d = new THREE.Mesh(geometrie, materiau);
scene.add(escalier3d);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const soleil = new THREE.DirectionalLight(0xffffff, 0.9);
soleil.position.set(1, -1, 2);
scene.add(soleil);

// Cadrage automatique sur la boîte englobante du modèle.
const boite = new THREE.Box3().setFromObject(escalier3d);
const centre = boite.getCenter(new THREE.Vector3());
const taille = boite.getSize(new THREE.Vector3()).length() || 100;

const grille = new THREE.GridHelper(taille * 3, 30, 0x9aa4ae, 0xc9c4b8);
grille.rotation.x = Math.PI / 2;
grille.position.z = boite.min.z;
scene.add(grille);

camera.position.copy(centre).add(new THREE.Vector3(taille * 0.9, -taille * 0.9, taille * 0.55));
camera.near = taille / 1000;
camera.far = taille * 50;
camera.updateProjectionMatrix();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(centre);
controls.enableDamping = true;
controls.update();

function redimensionner() {
  camera.aspect = conteneur.clientWidth / conteneur.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(conteneur.clientWidth, conteneur.clientHeight);
}
window.addEventListener("resize", redimensionner);

function animer() {
  requestAnimationFrame(animer);
  controls.update();
  renderer.render(scene, camera);
}
animer();
</script>
</body>
</html>
